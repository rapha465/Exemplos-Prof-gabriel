<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Login da plataforma reserve.me para reservas de salas e espaços da escola."
    />
    <title>Login | reserve.me</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <div class="brand-block" aria-label="Logo reserve.me">
        <div class="brand-mark" aria-hidden="true">R</div>
        <h1 class="logo">reserve.me</h1>
      </div>

      <form class="login-form" novalidate>
        <div class="field required">
          <label class="field-label" for="email">Obrigatório</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="E-mail"
            autocomplete="email"
            aria-label="E-mail"
            aria-required="true"
            aria-describedby="email-error"
          />
          <span class="error-message" id="email-error" aria-live="polite"></span>
        </div>

        <div class="field required">
          <label class="field-label" for="password">Obrigatório</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Senha"
            autocomplete="current-password"
            aria-label="Senha"
            aria-required="true"
            aria-describedby="password-error"
          />
          <span class="error-message" id="password-error" aria-live="polite"></span>
        </div>

        <button class="login-button" type="submit">Entrar</button>
        <a class="forgot-password" href="recuperar-senha.html">Esqueceu sua senha?</a>
      </form>
    </main>

    <footer class="auth-footer">
      <a href="termos-e-privacidade.html#termos-de-uso">Termos de uso</a>
      <a href="termos-e-privacidade.html#politica-de-privacidade">Privacidade</a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
